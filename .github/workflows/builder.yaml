name: Build add-on images

# Builds and publishes multi-arch images to GHCR.
# This is OPTIONAL — by default the add-on builds locally on each box.
# To consume these images instead, set in dev_ssh_debian/config.yaml:
#   image: "ghcr.io/elischleifer/{arch}-addon-dev-ssh-debian"
# and make the published packages public in your GitHub package settings.

on:
  push:
    branches: [main]
    paths:
      - "dev_ssh_debian/**"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64, armv7, i386]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/dev_ssh_debian \
            --image "{arch}-addon-dev-ssh-debian" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon
